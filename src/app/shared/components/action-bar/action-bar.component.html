<div class="page-toolbar">
  <div class="toolbar-start"><ng-content select="[toolbar-start]"></ng-content></div>
  <div class="toolbar-filters"><ng-content select="[filters]"></ng-content></div>
  <div class="toolbar-actions" role="group" [attr.aria-label]="'common.actions' | translate">
    @if (selectedCount() > 0) {
      <div class="toolbar-selection">
        <span role="status">{{ 'common.selected_rows' | translate }} {{ selectedCount() }}</span>
        <button type="button" class="erpm-btn erpm-btn-secondary erpm-btn-sm" (click)="clearSelection.emit()">
          {{ 'common.clear_selection' | translate }}
        </button>
      </div>
    }
    <ng-content select="[actions]"></ng-content>
    @if (primaryAction(); as main) {
      <button type="button" class="erpm-btn erpm-btn-primary toolbar-primary" [disabled]="main.disabled"
        (click)="actionSelect.emit(main.id)">
        @if (main.icon) { <span aria-hidden="true">{{ main.icon }}</span> }
        <span>{{ main.label | translate }}</span>
      </button>
    }
    @if (menuActions().length) {
      <app-dropdown-menu [items]="menuActions()" label="common.actions" (itemSelect)="actionSelect.emit($event)">
        <span class="erpm-btn erpm-btn-secondary toolbar-more-btn" aria-hidden="true">⋯</span>
      </app-dropdown-menu>
    }
  </div>
</div>
