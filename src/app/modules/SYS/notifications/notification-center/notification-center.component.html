<app-list-page
  title="notifications.center_title"
  subtitle="notifications.center_subtitle"
  [loading]="isLoading()"
  [count]="items().length"
  [total]="totalCount()"
  [page]="pageIndex()"
  [pageSize]="pageSize()"
  emptyText="ncen.empty"
  (pageChange)="setPage($event)"
  (retry)="loadData()"
  [actions]="headerActions"
  (actionSelect)="onHeaderAction($event)">

  <div filters>
  <app-form-control
    type="select"
    [label]="'notifications.filter_module' | translate"
    [options]="categoryOptions"
    [ngModel]="filterCategory()"
    (ngModelChange)="filterCategory.set($event); onFilterChange()"
  ></app-form-control>

  <app-form-control
    type="select"
    [label]="'notifications.filter_severity' | translate"
    [options]="severityOptions"
    [ngModel]="filterSeverity()"
    (ngModelChange)="filterSeverity.set($event); onFilterChange()"
  ></app-form-control>

  <app-form-control
    type="select"
    [label]="'notifications.filter_status' | translate"
    [options]="readStatusOptions"
    [ngModel]="filterReadStatus()"
    (ngModelChange)="filterReadStatus.set($event); onFilterChange()"
  ></app-form-control>
  </div>

  <!-- Desktop Table View -->
  <div *ngIf="!isLoading() && items().length > 0" class="desktop-only">
    <app-data-table
      [data]="items()"
      [clickableRows]="true"
      [showIndex]="false"
      [tableMinWidth]="'950px'"
      (rowClick)="onItemClick($event)"
    >
      <app-column key="categoryIcon" label="" width="48px" minWidth="48px" align="center">
        <ng-template let-row="row">
          <span class="text-center font-lg">{{ getCategoryIcon(row.category) }}</span>
        </ng-template>
      </app-column>

      <app-column key="category" label="ntpl.category" width="110px" minWidth="100px">
        <ng-template let-row="row">
          <span class="module-badge">{{ row.category }}</span>
        </ng-template>
      </app-column>

      <app-column key="content" label="ncen.col_content" minWidth="250px">
        <ng-template let-row="row">
          <div class="notif-cell-content" [class.font-bold]="!row.isRead">
            <span class="cell-title">{{ row.title }}</span>
            <span class="cell-body">{{ row.body }}</span>
          </div>
        </ng-template>
      </app-column>

      <app-column key="severity" label="ntpl.col_severity" width="140px" minWidth="130px" align="center">
        <ng-template let-row="row">
          <span class="severity-badge" [ngClass]="'badge-' + row.severity.toLowerCase()">
            {{ row.severity }}
          </span>
        </ng-template>
      </app-column>

      <app-column key="createdAtUtc" label="ncen.col_time" width="140px" minWidth="130px">
        <ng-template let-row="row">
          <span class="cell-time">{{ row.createdAtUtc | relativeTime }}</span>
        </ng-template>
      </app-column>

      <app-column key="actions" label="common.actions" width="100px" minWidth="90px" align="right">
        <ng-template let-row="row">
          <div class="flex items-center justify-end gap-1" (click)="$event.stopPropagation()">
            <button
              *ngIf="!row.isRead"
              type="button"
              class="icon-action-btn"
              [title]="'ncen.mark_read' | translate"
              (click)="markAsRead(row)"
            >
              ✓
            </button>
            <button
              type="button"
              class="icon-action-btn"
              [title]="'ncen.archive' | translate"
              (click)="archiveItem(row, $event)"
            >
              📥
            </button>
          </div>
        </ng-template>
      </app-column>
    </app-data-table>
  </div>

  <!-- Mobile Card View -->
  <div *ngIf="!isLoading() && items().length > 0" class="mobile-only mobile-cards-list">
    <div
      *ngFor="let item of items()"
      class="mobile-card"
      [class.card-unread]="!item.isRead"
      (click)="onItemClick(item)"
    >
      <div class="card-icon-box">
        {{ getCategoryIcon(item.category) }}
      </div>
      <div class="card-details">
        <div class="card-meta">
          <span class="module-badge">{{ item.category }}</span>
          <span class="severity-badge" [ngClass]="'badge-' + item.severity.toLowerCase()">
            {{ item.severity }}
          </span>
          <span class="cell-time ml-auto">{{ item.createdAtUtc | relativeTime }}</span>
        </div>
        <h4 class="card-title">{{ item.title }}</h4>
        <p class="card-body-text">{{ item.body }}</p>
      </div>
    </div>
  </div>
</app-list-page>
