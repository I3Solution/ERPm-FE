<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>ERPm - Quản trị Bán hàng, Tồn kho & Kế toán</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#4f46e5">

  <!-- Immediate Theme Pre-loader to Prevent Flash of Unstyled Content (FOUC) -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('erpm_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = savedTheme === 'dark' || ((!savedTheme || savedTheme === 'system') && prefersDark);
        if (isDark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          if (document.body) {
            document.body.classList.add('dark-theme', 'ion-palette-dark');
          } else {
            document.addEventListener('DOMContentLoaded', function () {
              document.body.classList.add('dark-theme', 'ion-palette-dark');
            });
          }
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="antialiased bg-slate-50 text-slate-900 font-sans">
  <app-root></app-root>
</body>
</html>
