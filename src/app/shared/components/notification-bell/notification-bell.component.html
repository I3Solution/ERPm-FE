<div class="bell-container">
  <button
    type="button"
    class="bell-btn"
    [class.shake]="notifState.isBellShaking()"
    [class.active]="notifState.isPopoverOpen()"
    (click)="togglePopover($event)"
    aria-label="Notifications"
  >
    <svg class="bell-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>

    <span *ngIf="notifState.hasUnread()" class="bell-badge">
      {{ notifState.badgeText() }}
    </span>
  </button>

  <app-notification-popover></app-notification-popover>
</div>
