<app-list-page title="usr.title" subtitle="usr.subtitle" [loading]="loading()" [count]="rows().length" [total]="rows().length"
  [pageSize]="1000000" emptyText="usr.empty" [actions]="headerActions" (actionSelect)="onHeaderAction($event)">
  <div filters class="usr-toolbar">
    <app-form-control class="usr-search" [formControl]="keywordControl" type="text" [placeholder]="'common.search' | translate"></app-form-control>
  </div>

  <div class="erpm-table-container">
    <app-data-table
      [data]="rows()"
      [loading]="loading()"
      [showIndex]="false"
      emptyMessage="usr.empty"
    >
      <app-column key="userName" label="acc.user_name" [sortable]="true">
        <ng-template let-row="row">
          <span class="font-mono font-medium">{{ row.userName }}</span>
        </ng-template>
      </app-column>

      <app-column key="displayName" label="acc.display_name" [sortable]="true">
        <ng-template let-row="row">
          <span class="font-medium text-slate-900 dark:text-slate-100">{{ row.displayName }}</span>
        </ng-template>
      </app-column>

      <app-column key="role" label="acc.role_label" [sortable]="true" [sortValue]="roleLabel">
        <ng-template let-row="row">
          <span class="erpm-badge erpm-badge-info">{{ ('acc.role.' + row.role) | translate }}</span>
        </ng-template>
      </app-column>

      <app-column key="employeeLabel" label="acc.employee" [sortable]="true">
        <ng-template let-row="row">
          <span>{{ row.employeeLabel }}</span>
        </ng-template>
      </app-column>

      <app-column key="status" label="common.status" align="center">
        <ng-template let-row="row">
          <span [class]="row.isActive ? 'erpm-badge erpm-badge-success' : 'erpm-badge erpm-badge-neutral'">
            <span class="dot"></span>
            {{ (row.isActive ? 'common.active' : 'common.inactive') | translate }}
          </span>
        </ng-template>
      </app-column>

      <app-column key="actions" label="common.actions" align="right">
        <ng-template let-row="row">
          <div class="flex items-center justify-end gap-1" (click)="$event.stopPropagation()">
            @if (auth.can('sys:user:edit')) {
              <button type="button" class="erpm-btn erpm-btn-secondary erpm-btn-sm" (click)="openEdit(row)">{{ 'common.edit' | translate }}</button>
            }
          </div>
        </ng-template>
      </app-column>
    </app-data-table>
  </div>
</app-list-page>

@if (dialogUser() !== undefined) {
  <app-user-form-dialog [user]="dialogUser() ?? null" [branchTree]="branchTree()" [isSuperAdmin]="isSuperAdmin()"
    (saved)="onSaved()" (closed)="closeDialog()"></app-user-form-dialog>
}
